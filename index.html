<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小工具入口</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: rgba(255, 255, 255, .88);
      --text: #1f2937;
      --muted: #64748b;
      --line: #dbe4ef;
      --brand: #2563eb;
      --shadow: 0 18px 50px rgba(15, 23, 42, .12);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(37, 99, 235, .18), transparent 28rem),
        radial-gradient(circle at 88% 18%, rgba(20, 184, 166, .18), transparent 26rem),
        linear-gradient(135deg, #f8fbff 0%, var(--bg) 100%);
      padding: 42px 18px;
    }

    .wrap { width: min(1100px, 100%); margin: 0 auto; }

    .hero {
      position: relative;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid rgba(219, 228, 239, .9);
      border-radius: 32px;
      padding: clamp(26px, 5vw, 48px);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      margin-bottom: 22px;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -90px;
      top: -90px;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(37,99,235,.18), rgba(20,184,166,.18));
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #eef6ff;
      color: #1d4ed8;
      font-weight: 700;
      font-size: .92rem;
      margin-bottom: 18px;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4.8rem);
      line-height: 1.05;
      letter-spacing: .03em;
    }

    .desc {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 1.05rem;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin: 22px 0 14px;
    }

    .search-box {
      flex: 1 1 280px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 12px 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      font: inherit;
      background: transparent;
      color: var(--text);
    }

    .refresh-btn,
    .filter-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 11px 16px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
      transition: .18s ease;
    }

    .refresh-btn:hover,
    .filter-btn:hover { transform: translateY(-2px); }

    .filter-btn.active {
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #14b8a6);
      border-color: transparent;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 0 22px;
    }

    .count {
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 220px;
      padding: 22px;
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      text-decoration: none;
      border: 1px solid rgba(219, 228, 239, .95);
      box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 7px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-5px);
      box-shadow: 0 18px 44px rgba(15, 23, 42, .14);
      border-color: rgba(37, 99, 235, .35);
    }

    .icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(37,99,235,.12), rgba(20,184,166,.12));
      font-size: 1.8rem;
      margin-bottom: 18px;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.35rem;
      letter-spacing: .02em;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      flex: 1;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin: 0 0 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #475569;
      font-size: .82rem;
      font-weight: 700;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #eef2f7;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 700;
    }

    .go { color: var(--brand); }

    .empty {
      display: none;
      text-align: center;
      padding: 36px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255,255,255,.72);
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: .92rem;
    }

    @media (max-width: 640px) {
      body { padding: 20px 12px; }
      .hero { border-radius: 24px; }
      .toolbar { align-items: stretch; }
      .count { width: 100%; text-align: center; }
      .card { min-height: 190px; }
      .refresh-btn { width: 100%; }
      .filter-btn { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">✨ GitHub Pages 小工具集</div>
      <h1>我的網頁工具箱</h1>
      <p class="desc">這裡放一些自己做的小工具與小遊戲。主要工具可手動分類與命名；自動掃描到的新檔會先放進「未分類」，之後再慢慢整理就好。</p>
    </section>

    <section class="toolbar" aria-label="工具搜尋區">
      <label class="search-box">
        🔎
        <input id="searchInput" type="search" placeholder="搜尋工具名稱、說明或分類，例如：遊戲、工廠、數織" autocomplete="off" />
      </label>
      <button class="refresh-btn" id="refreshBtn" type="button">🔄 一鍵更新</button>
      <div class="count" id="countText">共 0 個工具</div>
    </section>

    <section class="filters" id="filterBar" aria-label="分類篩選"></section>

    <section class="grid" id="appGrid" aria-label="工具入口清單"></section>
    <section class="empty" id="emptyState">找不到符合的工具，換個關鍵字或分類試試看。</section>

    <footer>Made for fun · Hosted on GitHub Pages</footer>
  </main>

  <script>
    const owner = "more200594";
    const repo = "nonogram";

    const categories = ["全部", "遊戲", "工具", "模擬器", "測試頁", "未分類"];
    let activeCategory = "全部";

    // 主要工具：這裡可以手動改名稱、說明、分類、圖示與顏色。
    const apps = [
      {
        name: "數織小工具",
        description: "自訂長寬、協助標記與整理數織題目的小工具。",
        url: "chatnono.html",
        icon: "🧩",
        type: "Game",
        category: "遊戲",
        accent: "#7c3aed",
        accent2: "#a78bfa"
      },
      {
        name: "踩地雷",
        description: "經典 Minesweeper 小遊戲，支援插旗、計時與不同難度。",
        url: "minesweeper.html",
        icon: "💣",
        type: "Game",
        category: "遊戲",
        accent: "#dc2626",
        accent2: "#f97316"
      },
      {
        name: "貪食蛇",
        description: "Nokia 手機風格的復古貪食蛇，方向鍵或手機按鍵都能玩。",
        url: "snake.html",
        icon: "🐍",
        type: "Game",
        category: "遊戲",
        accent: "#16a34a",
        accent2: "#84cc16"
      },
      {
        name: "工廠模擬器",
        description: "用方格、牆壁與傳送帶規劃工廠路線與藍圖配置。",
        url: "Factory/",
        icon: "🏭",
        type: "Simulator",
        category: "模擬器",
        accent: "#2563eb",
        accent2: "#14b8a6"
      },
      {
  name: "吐嘈群",
  description: "閒閒沒事幹想吐嘈時",
  url: "87_plus.html",
  icon: "✨",
  type: "temp",
  category: "測試頁",
  accent: "#2563eb",
  accent2: "#14b8a6"
},
    {
  name: "誇誇群",
  description: "閒閒沒事幹想誇誇時",
  url: "Good_PLUS.html",
  icon: "✨",
  type: "temp",
  category: "測試頁",
  accent: "#2563eb",
  accent2: "#14b8a6"
},
    {
  name: "配色器V1版",
  description: "第一版製的配色器, 色彩多色固定",
  url: "color_palette.html",
  icon: "✨",
  type: "Tool",
  category: "工具",
  accent: "#2563eb",
  accent2: "#14b8a6"
},
    {
  name: "配色器V2版",
  description: "第二版製作的配色器, 色彩可以吸取",
  url: "color_palette_generator_aa.html",
  icon: "✨",
  type: "Tool",
  category: "工具",
  accent: "#2563eb",
  accent2: "#14b8a6"
},
    {
  name: "數織小工具(gemini版)",
  description: "訂長寬、無限題目、可拖曳作畫的 Nonogram / Picross 解題助手",
  url: "gemininono.html",
  icon: "✨",
  type: "Game",
  category: "遊戲",
  accent: "#2563eb",
  accent2: "#14b8a6"
},
      {
  name: "PDF 合併工具",
  description: "拖曳多個 PDF、調整順序後一鍵合併下載。",
  url: "pdf_merge.html",
  icon: "📎",
  type: "Tool",
  category: "工具",
  accent: "#2563eb",
  accent2: "#14b8a6"
}
    ];

    const appGrid = document.getElementById("appGrid");
    const searchInput = document.getElementById("searchInput");
    const countText = document.getElementById("countText");
    const emptyState = document.getElementById("emptyState");
    const refreshBtn = document.getElementById("refreshBtn");
    const filterBar = document.getElementById("filterBar");

    let allApps = [...apps];

    function normalizeUrl(url) {
      return url.replace(/^\.\//, "").replace(/\/$/, "");
    }

    function prettyName(filename) {
      return filename
        .replace(/\.html$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function guessCategory(filename, type) {
      const lower = filename.toLowerCase();
      if (lower.includes("snake") || lower.includes("mine") || lower.includes("game")) return "遊戲";
      if (lower.includes("factory") || lower.includes("simulator")) return "模擬器";
      if (lower.includes("test") || lower.includes("demo") || lower.includes("temp")) return "測試頁";
      if (lower.includes("tool") || lower.includes("nonogram") || lower.includes("chatnono")) return "工具";
      return "未分類";
    }

    function autoIcon(name, type, category) {
      const lower = name.toLowerCase();
      if (lower.includes("snake")) return "🐍";
      if (lower.includes("mine")) return "💣";
      if (lower.includes("factory")) return "🏭";
      if (category === "遊戲") return "🎮";
      if (category === "工具") return "🛠️";
      if (category === "模擬器") return "🧪";
      if (category === "測試頁") return "🧫";
      if (type === "dir") return "📁";
      return "✨";
    }

    function renderFilters() {
      filterBar.innerHTML = categories.map(category => `
        <button class="filter-btn ${category === activeCategory ? "active" : ""}" type="button" data-category="${category}">${category}</button>
      `).join("");
    }

    function renderApps(keyword = "") {
      const normalizedKeyword = keyword.trim().toLowerCase();

      const filteredApps = allApps.filter(app => {
        const text = `${app.name} ${app.description} ${app.type} ${app.category}`.toLowerCase();
        const matchKeyword = text.includes(normalizedKeyword);
        const matchCategory = activeCategory === "全部" || app.category === activeCategory;
        return matchKeyword && matchCategory;
      });

      appGrid.innerHTML = filteredApps.map(app => `
        <a class="card" href="${app.url}" style="--accent:${app.accent}; --accent-2:${app.accent2};">
          <div class="icon" aria-hidden="true">${app.icon}</div>
          <span class="tag">${app.category}</span>
          <h2>${app.name}</h2>
          <p>${app.description}</p>
          <div class="meta">
            <span>${app.type}</span>
            <span class="go">開啟 →</span>
          </div>
        </a>
      `).join("");

      countText.textContent = `共 ${filteredApps.length} 個工具`;
      emptyState.style.display = filteredApps.length ? "none" : "block";
      renderFilters();
    }

    async function loadAutoApps() {
      try {
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`, { cache: "no-store" });
        const files = await response.json();
        if (!Array.isArray(files)) return;

        const manualUrls = new Set(apps.map(app => normalizeUrl(app.url)));
        const autoApps = files
          .filter(file => {
            if (file.name === "index.html") return false;
            if (file.type === "file" && file.name.toLowerCase().endsWith(".html")) return !manualUrls.has(normalizeUrl(file.name));
            if (file.type === "dir") return !manualUrls.has(normalizeUrl(file.name));
            return false;
          })
          .map(file => {
            const isDir = file.type === "dir";
            const url = isDir ? `${file.name}/` : file.name;
            const category = guessCategory(file.name, file.type);
            const name = prettyName(file.name);
            return {
              name,
              description: category === "未分類"
                ? "自動偵測到的新入口，尚未手動分類。"
                : "自動偵測並初步分類的入口。",
              url,
              icon: autoIcon(file.name, file.type, category),
              type: isDir ? "Folder" : "Auto",
              category,
              accent: category === "遊戲" ? "#dc2626" : category === "工具" ? "#7c3aed" : category === "模擬器" ? "#2563eb" : category === "測試頁" ? "#f59e0b" : "#64748b",
              accent2: category === "遊戲" ? "#f97316" : category === "工具" ? "#a78bfa" : category === "模擬器" ? "#14b8a6" : category === "測試頁" ? "#fbbf24" : "#94a3b8"
            };
          });

        allApps = [...apps, ...autoApps];
        renderApps(searchInput.value);
      } catch (error) {
        console.warn("GitHub 自動掃描失敗：", error);
      }
    }

    filterBar.addEventListener("click", event => {
      const button = event.target.closest("button[data-category]");
      if (!button) return;
      activeCategory = button.dataset.category;
      renderApps(searchInput.value);
    });

    searchInput.addEventListener("input", event => renderApps(event.target.value));

    refreshBtn.addEventListener("click", async () => {
      refreshBtn.textContent = "🔄 更新中...";
      allApps = [...apps];
      renderApps(searchInput.value);
      await loadAutoApps();
      refreshBtn.textContent = "🔄 一鍵更新";
    });

    renderFilters();
    renderApps();
    loadAutoApps();
  // 🔥 點未分類卡片 → 產生可貼設定
    document.addEventListener("click", (e) => {
      const card = e.target.closest(".card");
      if (!card) return;

      const name = card.querySelector("h2")?.innerText || "";
      const url = card.getAttribute("href") || "";
      const tag = card.querySelector(".tag")?.innerText || "";

      if (tag !== "未分類") return; // 只針對未分類

      const template = `{
  name: "${name}",
  description: "請補上說明",
  url: "${url.replace(/\/$/,"")}",
  icon: "✨",
  type: "Tool",
  category: "工具",
  accent: "#2563eb",
  accent2: "#14b8a6"
}`;

      navigator.clipboard.writeText(template);
      alert("已複製設定模板，貼到 apps 裡即可使用！");
    });

</script>
</body>
</html>
